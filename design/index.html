<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src https://design-api.thelocalcabinetry.com; frame-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex">
<title>Design your cabinets | The Local Cabinetry</title>
<link rel="canonical" href="https://thelocalcabinetry.com/design/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23B3641A%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27system-ui,sans-serif%27 font-size=%2711%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3ETLC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/design/app.css">
</head>
<body data-guest="1"><div class="app">
<div class="top"><b>Design your cabinets</b><span id="who">Guest</span><a class="signin" id="signin" href="/design/login/" hidden>Sign in to send to our team</a><span class="soon" id="soon" hidden>Email sign-in is opening soon.</span><button type="button" id="logout" data-user hidden>Log out</button></div>
<div class="main solo" id="main">
<section class="left"><div class="tabs" role="tablist"><button type="button" role="tab" data-tool="kitchen" aria-selected="false">Kitchen</button><button type="button" role="tab" data-tool="closet" aria-selected="false">Closet</button><button type="button" role="tab" data-tool="vanity" aria-selected="false">Vanity</button><button type="button" role="tab" data-tool="unit" aria-selected="false">Free design</button><span class="grow"></span><button type="button" class="save" id="save" data-user hidden>Save design</button></div>
<div class="save-status guestnote" id="guestnote" data-guest-only aria-live="polite"></div>
<div class="save-status" id="save-status" data-user hidden aria-live="polite"></div>
<iframe id="tool" title="Design tool"></iframe></section>
<section class="right" data-user hidden><div class="tabs" role="tablist"><button type="button" role="tab" data-pane="chat" aria-selected="true">Chat with our team</button><button type="button" role="tab" data-pane="items" aria-selected="false">My items</button></div>
<div class="pane" id="pane-chat"><div id="chat-root"></div></div>
<div class="pane" id="pane-items" hidden><div class="items-wrap"><select id="design-pick" aria-label="Saved design"></select><div class="chat-note" id="items-note"></div><table id="items"></table></div></div>
</section></div></div>
<script src="/design/lco-config.js"></script><script src="/design/chat.js"></script><script src="/design/app.js"></script></body></html>
