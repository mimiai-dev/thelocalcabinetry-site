name: check-assets
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sh scripts/check-assets.sh origin/${{ github.base_ref }}
      - run: node scripts/news/check.mjs
      - run: node --test scripts/news/test-gate.mjs
