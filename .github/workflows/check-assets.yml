name: check-assets
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a hung browser test stops here, not after GitHub's 6 hours
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # global WebSocket for the headless Chrome test
      - run: sh scripts/check-assets.sh origin/${{ github.base_ref }}
      - run: node scripts/test-link-attrs.mjs
      - run: node scripts/test-loyalty-copy.mjs   # loyalty card copy: no semicolons, no "never expire", the 1-year expiry in the policy (owner 2026-11-18)
      - run: node scripts/news/check.mjs
      - run: node --test scripts/news/test-gate.mjs
      # t.js in a fake browser (no Chrome): the form / popup funnel. (test-time-on-page.mjs is stale since the leave event got scroll depth d on 2026-11-06: not in CI until fixed)
      - run: node scripts/test-form-funnel.mjs
      # chat.js's popup and contact band in the runner's headless Chrome (Ubuntu 24.04 blocks Chrome's sandbox namespaces by default)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: CHROME="$(command -v google-chrome || command -v google-chrome-stable)" node scripts/test-lead-forms.mjs
      # chat.js on a phone (iPhone-size viewport, touch): the panel follows visualViewport, the page behind sheets is locked, email fields and their buttons
      - if: ${{ !cancelled() }}
        run: CHROME="$(command -v google-chrome || command -v google-chrome-stable)" node scripts/test-chat-mobile.mjs
